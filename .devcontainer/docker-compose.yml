services:
    app:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile

        volumes:
            - ../..:/workspaces:cached

        # Overrides default command so things don't shut down after the process ends.
        command: sleep infinity

        environment:
            - NODE_ENV=development
            - DATABASE_URL=postgresql://postgres:postgres@db:5432/teaching_api?schema=public
            - TEST_DATABASE_URL=postgresql://postgres:postgres@db:5432/teaching_api_test?schema=public
            - PORT=3002

        # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
        network_mode: service:db

        depends_on:
            - db

        # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
        # Do NOT add "ports" here: host bindings collide with other dev containers.

    db:
        image: postgres:17.2
        # Don't auto-start with Docker/WSL; VS Code starts it when the project is opened.
        restart: 'no'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
            POSTGRES_DB: teaching_api

        # Ports 3002 (API) and 5432 (Postgres) are forwarded via "forwardPorts" in devcontainer.json.

volumes:
    postgres-data:
